name: scan_hb

on:
  schedule:
    - cron: '55 */8 * * *' # 
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp
      - name: 安装 Python 依赖库
        run: |
          pip install aiohttp tqdm
          
      - name: Run Scanner
        run: python py/scan_hb_telecom.py

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          
          # 先拉取远程最新代码，防止冲突和拒绝推送
          git pull origin main --rebase || echo "No remote changes to pull"
          
          git add py/hb_telecom.m3u py/hb_telecom_tvbox.txt py/scanned_history.json
          git commit -m "Update IPTV sources $(date)" || exit 0
          
          # 再次尝试推送，如果还有冲突则强制对齐
          git push origin main || git push origin HEAD:main --force
